[pytest]
testpaths = tests
markers =
    gpu: tests that require a CUDA GPU (deselect with '-m "not gpu"')
    hopper: tests that require SM90 (Hopper) GPU
    blackwell: tests that require SM100 (Blackwell) GPU
    sm120: tests that require SM120 (Blackwell) GPU
    multigpu: tests that spawn one process per GPU (need >= 2 visible GPUs)
    cp_inter_intra: tests that need combined inter+intra CP (see cp_arch.ARCH_CAPS)
    needs_bwd: tests that need the backward kernels (absent on SM120)
    slow: tests that take more than 30 seconds
addopts = -v --tb=short
